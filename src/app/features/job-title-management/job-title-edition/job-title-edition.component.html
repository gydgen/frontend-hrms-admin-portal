<header class="form-page__header">
  <div>
    <h1 class="section-header__title">{{ isNew() ? 'Add Job Title' : 'Edit Job Title' }}</h1>
    <p class="section-header__description">Capture the job title name and its department.</p>
  </div>

  <a class="btn btn-outline-secondary" routerLink="../">Back</a>
</header>

<section class="form-page__content">
  <form [formGroup]="form" class="form-fieldset">
    <legend class="form-fieldset__legend">Job Title Details</legend>

    <div class="form-fieldset__inputs">
      <div class="form-fieldset__input">
        <label for="title">Job title</label>
        <input id="title" class="form-control" formControlName="title" />
        <app-field-error [control]="form.controls.title" />
      </div>

      <div class="form-fieldset__input">
        <label for="departmentId">Department</label>
        <select id="departmentId" class="form-select" formControlName="departmentId">
          <option [ngValue]="null">No department</option>
          @for (department of departments.value(); track department.id) {
            <option [ngValue]="department.id">{{ department.name }}</option>
          }
        </select>
      </div>
    </div>
  </form>

  <div class="form-page__footer-buttons">
    <button type="button" class="btn btn-outline-secondary" (click)="cancelEdit()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()">Save</button>
  </div>
</section>
