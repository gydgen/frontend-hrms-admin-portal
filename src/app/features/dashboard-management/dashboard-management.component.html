<div class="dashboard">
  <nav>
    <app-navbar />
  </nav>

  <div class="main d-flex">
    <aside>
      <nav>
        <a
          [routerLink]="['home']"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="material-symbols-outlined">dashboard</span> Dashboard</a
        >

        <div
          data-bs-toggle="collapse"
          href="#permissions"
          role="button"
          aria-expanded="false"
          aria-controls="permissions"
          class="d-flex justify-content-between align-items-center collapsing-bar"
        >
          <a> <span class="material-symbols-outlined">security</span>Permissions</a>

          <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </div>

        <div class="collapse for-setup" id="permissions">
          <div class="nav-links">
            <ul class="navbar-menu-sub">
              <li class="nav-sub-item">
                <a
                  [routerLink]="['departments']"
                  routerLinkActive="active-link"
                  class="nav-sub-link"
                  ><span class="material-symbols-outlined">apartment</span>Departments</a
                >
              </li>
            </ul>
          </div>
        </div>

        <p>Employee Management</p>
        <a [routerLink]="['manage-employees']" routerLinkActive="active-link">
          <span class="material-symbols-outlined">people</span>Employees</a
        >
        <a [routerLink]="['manage-roles']" routerLinkActive="active-link">
          <span class="material-symbols-outlined">badge</span>Roles</a
        >

        <p>Organizational Management</p>
        <a [routerLink]="['access-roles']" routerLinkActive="active-link">
          <span class="material-symbols-outlined">admin_panel_settings</span>
          Access Roles</a
        >
        <a [routerLink]="['account-settings']" routerLinkActive="active-link">
          <span class="material-symbols-outlined">settings</span>
          Account Settings</a
        >
      </nav>
    </aside>
    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>
